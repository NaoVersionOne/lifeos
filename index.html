<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Life OS Tracker</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1e26; --card2:#232936; --text:#e8eaf0; --dim:#8b93a7;
    --accent:#4ade80; --accent2:#60a5fa; --warn:#fbbf24; --line:#2d3444;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f4f5f8;--card:#ffffff;--card2:#eef1f6;--text:#1a2030;--dim:#5b6478;--line:#dfe3ec;}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;padding-bottom:80px}
  header{padding:calc(env(safe-area-inset-top) + 18px) 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
  header h1{font-size:19px;font-weight:700}
  header .date{color:var(--dim);font-size:13px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:12px 0 10px;background:none;border:none;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer}
  nav button.on{color:var(--accent)}
  main{padding:8px 14px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin-bottom:10px}
  .card h2 .sub{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  .muted{color:var(--dim);font-size:12px}
  .habit-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .habit-row:last-child{border-bottom:none}
  .habit-name{font-size:14px}
  .tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:16px;cursor:pointer;transition:.15s}
  .tick.on{background:var(--accent);border-color:var(--accent);color:#0b1220}
  .weekgrid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;font-size:11px;align-items:center;margin-top:8px}
  .weekgrid .h{color:var(--dim);text-align:center}
  .dot{height:16px;border-radius:5px;background:var(--card2)}
  .dot.on{background:var(--accent)}
  .dot.half{background:var(--warn)}
  .ex{background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .ex .name{font-weight:600;font-size:14px}
  .ex .scheme{color:var(--accent2);font-size:12px;margin:2px 0 6px}
  .ex .last{color:var(--dim);font-size:12px;margin-bottom:6px}
  .sets{display:flex;flex-wrap:wrap;gap:6px}
  .set{display:flex;align-items:center;gap:3px}
  .set input{width:52px;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;text-align:center}
  .set span{color:var(--dim);font-size:12px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent);color:#0b1220;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn.small{width:auto;display:inline-block;padding:8px 14px;font-size:13px;margin-right:8px}
  .btn.resting{background:var(--warn);color:#0b1220;border:none}
  .pill{display:inline-block;background:var(--card2);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--dim);margin:0 6px 6px 0}
  .pill.on{background:var(--accent2);color:#0b1220}
  canvas{width:100%;height:160px}
  .stat-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .stat-row.four .stat{flex:1 1 calc(50% - 5px)}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat .v{font-size:22px;font-weight:700;color:var(--accent)}
  .stat .l{font-size:11px;color:var(--dim);margin-top:2px}
  textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px;font-size:12px}
  .hist{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
  .hist:last-child{border:none}
  .hist .d{color:var(--dim);font-size:11px}
  input[type=number].big{width:110px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;text-align:center}
  .row{display:flex;gap:10px;align-items:center}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0b1220;padding:10px 18px;border-radius:22px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  /* ===== redesign: Today ===== */
  .ringwrap{display:flex;align-items:center;gap:16px}
  .ring{width:88px;height:88px;flex:0 0 88px}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring .bg{stroke:var(--card2)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .45s cubic-bezier(.3,1.2,.4,1)}
  .ring text{fill:var(--text);font-size:26px;font-weight:700;text-anchor:middle;font-family:inherit}
  .ringside .big{font-size:17px;font-weight:700;line-height:1.25}
  .ringside .small{color:var(--dim);font-size:12.5px;margin-top:4px;line-height:1.4}
  .daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .daynav button{background:none;border:none;color:var(--dim);font-size:20px;padding:2px 10px;cursor:pointer;font-family:inherit}
  .daynav button[disabled]{opacity:.25}
  .daynav .lbl{font-size:12px;color:var(--dim);font-weight:600}
  .anchor{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:none;border:none;
    border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer;color:inherit;font-family:inherit}
  .anchor:last-child{border-bottom:none}
  .anchor .box{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:15px;color:transparent;transition:.15s}
  .anchor.on .box{background:var(--accent);border-color:var(--accent);color:#0b1220}
  .anchor .t{font-size:15.5px;font-weight:600;transition:.15s}
  .anchor.on .t{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--dim)}
  .anchor .s{font-size:12px;color:var(--dim);margin-top:2px}
  .done-note{text-align:center;color:var(--accent);font-size:13.5px;font-weight:600;padding:14px 0 2px}

  /* ===== redesign: Progress ===== */
  .sect{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:16px 2px 8px}
  .sect:first-child{margin-top:4px}
  .hero{display:flex;align-items:flex-end;gap:10px}
  .hero .n{font-size:42px;font-weight:800;line-height:.95;letter-spacing:-.02em}
  .hero .u{font-size:15px;color:var(--dim);padding-bottom:4px}
  .delta{font-size:13px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card2);margin-left:auto;white-space:nowrap}
  .delta.good{color:var(--accent)} .delta.bad{color:var(--warn)} .delta.flat{color:var(--dim)}
  .heat{display:grid;grid-template-rows:repeat(7,18px);grid-auto-flow:column;grid-auto-columns:18px;gap:4px;margin-top:12px;justify-content:space-between}
  .heat i{border-radius:4px;background:var(--card2)}
  .heat i.l1{background:var(--accent);opacity:.3}
  .heat i.l2{background:var(--accent);opacity:.55}
  .heat i.l3{background:var(--accent);opacity:.78}
  .heat i.l4{background:var(--accent);opacity:1}
  .heat i.future{background:transparent;border:1px dashed var(--line)}
  .heatlab{display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;margin-top:6px}
  .bar-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:inherit;
    font-family:inherit;padding:9px 2px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
  .bar-row:last-child{border-bottom:none}
  .bar-row.sup .nm{color:var(--dim)}
  .bar-row .nm{font-size:13.5px;flex:0 0 104px}
  .bar-track{flex:1;height:8px;border-radius:6px;background:var(--card2);overflow:hidden;display:block}
  .bar-fill{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s}
  .bar-fill.ok{background:var(--accent2)}
  .bar-fill.mid{background:var(--warn)}
  .bar-row .pc{font-size:12.5px;color:var(--dim);flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums}
  .subhead{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:14px 0 2px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;
    cursor:pointer;font-family:inherit;color:inherit}
  .tile .v{font-size:20px;font-weight:800;color:var(--accent2);line-height:1.1}
  .tile .l{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.3}
  .tile .chev{font-size:9px;color:var(--line);margin-top:3px}

  /* ===== redesign: drill-down sheet ===== */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:10}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;overflow:auto;background:var(--card);
    border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:8px 16px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(103%);transition:transform .26s cubic-bezier(.3,.9,.3,1);z-index:11}
  .sheet.show{transform:translateY(0)}
  .sheet .card{background:none;border:none;padding:0;margin:0}
  .sheet .card h2{font-size:16px}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 12px}
  .sheet h3{font-size:16px;margin-bottom:2px}
  .sheet .sh-sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .kv:last-child{border-bottom:none}
  .kv span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
  .strip{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 14px}
  .strip i{width:calc((100% - 33px)/12);aspect-ratio:1;border-radius:3px;background:var(--card2)}
  .strip i.on{background:var(--accent)} .strip i.na{background:transparent;border:1px dashed var(--line)}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header><h1 id="title">Life OS</h1><div class="date" id="today-label"></div></header>
<main id="view"></main>
<nav>
  <button data-tab="today" class="on">Today</button>
  <button data-tab="train">Train</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="data">Data</button>
</nav>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>

<script>
"use strict";
/* ---------- storage ---------- */
const KEY="lifeos-v1";
let DB=JSON.parse(localStorage.getItem(KEY)||"null")||{habits:{},workouts:[],weights:[],cardio:[],startDate:"2026-07-14"};
/* migration: new metric arrays, additive only — never touches existing data */
(()=>{let ch=false;["waist","steps"].forEach(k=>{if(!Array.isArray(DB[k])){DB[k]=[];ch=true;}});
 if(ch&&localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify(DB));})();
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${dd}`;};
const today=()=>iso(new Date());
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);};
let viewDate=null;
function curViewDate(){return viewDate||today();}
function addDays(dstr,n){const d=new Date(dstr+"T00:00:00");d.setDate(d.getDate()+n);return iso(d);}

/* ---------- habits ---------- */
/* [key, label, startDate?] — habits added later only count from their start date,
   so adding one never retroactively damages historical percentages. */
const HABITS=[["p","Prayer & Scripture"],["t","Training"],["d","Deep work block"],
  ["f","Family block present"],["c","Couple time"],["w","Writing / Reading"],
  ["s","In bed by 23:00"],["v","Vitamin D taken","2026-08-24"],
  ["n","Steps 12k+","2026-08-24"]];
const SHORT={p:"Prayer",t:"Train",d:"Deep",f:"Family",c:"Couple",w:"Write/Read",s:"Bed 23:00",v:"Vit D",n:"Steps"};
function habitsOn(dstr){return HABITS.filter(h=>!h[2]||dstr>=h[2]);}

/* ---------- program ---------- */
const PROGRAM={
 A:{day:4,name:"Shred A — Chest/Triceps/Abs",ex:[
   {n:["Bench Press","Bench Press","Bench Press"],s:[4,4,3]},
   {n:["Incline DB Press","Incline DB Press","Cable Fly"],s:[3,3,3]},
   {n:["Dips (or Decline Press)","Dips (or Decline Press)","Dips (or Decline Press)"],s:[3,3,3]},
   {n:["Close-Grip Bench","Close-Grip Bench","Rope Pressdown"],s:[3,3,3]},
   {n:["Overhead Triceps Extension","Overhead Triceps Extension","Overhead Triceps Extension"],s:[3,3,3]},
   {n:["Cable Crunch","Cable Crunch","Cable Crunch"],s:[3,3,3]}]},
 B:{day:2,name:"Shred B — Shoulders/Legs/Calves",ex:[
   {n:["Barbell Shoulder Press","Barbell Shoulder Press","Barbell Shoulder Press"],s:[4,4,3]},
   {n:["Squat","Squat","Squat"],s:[4,4,3]},
   {n:["Deadlift","Deadlift","Leg Press"],s:[3,3,3]},
   {n:["Walking Lunge (per leg)","Walking Lunge (per leg)","Walking Lunge (per leg)"],s:[3,3,3]},
   {n:["Lateral Raise","Lateral Raise","Lateral Raise"],s:[3,3,4]},
   {n:["Standing Calf Raise","Standing Calf Raise","Standing Calf Raise"],s:[3,3,4]}]},
 C:{day:5,name:"Shred C — Back/Traps/Biceps",ex:[
   {n:["Barbell Bent-Over Row","Barbell Bent-Over Row","Barbell Bent-Over Row"],s:[4,4,3]},
   {n:["Lat Pulldown","Lat Pulldown","Lat Pulldown"],s:[3,3,3]},
   {n:["Seated Cable Row","Seated Cable Row","Seated Cable Row"],s:[3,3,3]},
   {n:["Barbell Shrug","Barbell Shrug","Barbell Shrug"],s:[3,3,3]},
   {n:["Barbell Curl","Barbell Curl","EZ-Bar Preacher Curl"],s:[3,3,3]},
   {n:["Hammer Curl","Hammer Curl","Hammer Curl"],s:[3,3,3]}]}
};
const SCHEMES=["Wave 1 · 9–11 reps · 60s cardio between sets","Wave 2 · 6–8 reps heavier · 60s cardio between sets","Wave 3 · 12–15 reps · 60s cardio between sets"];
const RESTS=[60,60,60];
/* rest timer + beep */
let actx=null,restIv=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,actx.currentTime);o.start();o.stop(actx.currentTime+.3);}catch(e){}}
function startRest(btn){
  beep&&(actx=actx||new (window.AudioContext||window.webkitAudioContext)());
  if(restIv)clearInterval(restIv);
  let left=RESTS[phaseIdx()];
  btn.classList.add("resting");
  const tick=()=>{btn.textContent=`Cardio! ${left}s (tap to restart)`;if(left--<=0){clearInterval(restIv);restIv=null;btn.classList.remove("resting");btn.textContent=`Cardio accel — ${RESTS[phaseIdx()]}s`;beep();toast("Cardio done — lift");}};
  tick();restIv=setInterval(tick,1000);
}
const CARDIO={3:"Run/Walk — Zone 2 (C25K) — out of gym",6:"Long Walk-Run — out of gym"};

function weekNum(){const s=new Date(DB.startDate),n=new Date(today());return Math.max(1,Math.floor((n-s)/(7*864e5))+1);}
function phaseIdx(){const w=weekNum();return w<=4?0:w<=8?1:2;}
function isDeload(){const w=weekNum();return w===8||w===12||(w>12&&(w-12)%4===0);}
function sessionForDay(dow){for(const k in PROGRAM)if(PROGRAM[k].day===dow)return k;return null;}
function lastWorkout(sess){for(let i=DB.workouts.length-1;i>=0;i--)if(DB.workouts[i].session===sess)return DB.workouts[i];return null;}

/* ---------- views ---------- */
const view=document.getElementById("view");
let tab="today";

function render(){
  document.getElementById("today-label").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  ({today:renderToday,train:renderTrain,progress:renderProgress,data:renderData})[tab]();
}

/* ----- Today: the anchors, and only what today asks -----
   Four constants that never pause, plus the day's own ask. Taps only, ~15 seconds.
   Vitamin D / Steps / Writing keep their data and live on Progress as supporting
   metrics - they are inputs to the goal, not anchors of the life. */
const CORE_A=["p","f","c","s"];
const DAY_A={d:[2,3,4,5],t:[2,3,4,5,6]};
const ANCHOR_KEYS=["p","d","t","f","c","s"];
const SUPPORT_KEYS=["w","v","n"];
const HLABEL=(()=>{const o={};HABITS.forEach(h=>o[h[0]]=h[1]);return o;})();
const TRAIN_BY_DAY={2:"Strength A",3:"Run / walk — Zone 2",4:"Strength B",5:"Strength C",6:"Long walk-run"};
const DEEP_BY_DAY={2:"Business B",3:"Business A",4:"Business B",5:"Business A"};
const SUBL={p:"15 min, before the phone",f:"6:00–8:30pm, fully present",c:"8:30pm, screen-free",s:"wind-down, lights out 23:00"};
const NEXTN={p:"prayer",d:"deep work",t:"training",f:"family",c:"couple time",s:"bed"};
function dowOf(ds){return new Date(ds+"T00:00:00").getDay();}
function askedOn(ds){const w=dowOf(ds);return ANCHOR_KEYS.filter(k=>CORE_A.includes(k)||DAY_A[k].includes(w));}
function subFor(k,ds){const w=dowOf(ds);
  if(k==="d")return (DEEP_BY_DAY[w]||"")+" · 5:15am";
  if(k==="t")return TRAIN_BY_DAY[w]||"session";
  return SUBL[k]||"";}
function dayScoreA(ds){const h=DB.habits[ds]||{},a=askedOn(ds);return{done:a.filter(k=>h[k]).length,of:a.length};}
function coreHeld(ds){const h=DB.habits[ds]||{};return CORE_A.every(k=>h[k]);}
function mondayISO(ds){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}

function renderToday(){
  const vd=curViewDate(),h=DB.habits[vd]||{},isT=vd===today();
  const keys=askedOn(vd),done=keys.filter(k=>h[k]).length,n=keys.length;
  const C=2*Math.PI*40,off=C*(1-(n?done/n:0));
  const st=anchorStreak();
  const nextK=keys.find(k=>!h[k]);
  const line = done===n ? "Anchors held. That's the day."
             : done===0 ? "Begin with the end in mind."
             : (n-done)+" left — "+(NEXTN[nextK]||"")+" next.";
  const md=ds=>{const d=new Date(ds+"T00:00:00");return d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});};
  let html=`<div class="card">
    <div class="daynav">
      <button id="d-prev">‹</button>
      <span class="lbl">${isT?"TODAY":md(vd).toUpperCase()}</span>
      <button id="d-next" ${vd>=today()?"disabled":""}>›</button>
    </div>
    <div class="ringwrap">
      <svg class="ring" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="40"></circle>
        <circle class="fg" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"
          stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle>
        <text x="50" y="59">${done}<tspan font-size="15" fill="var(--dim)">/${n}</tspan></text>
      </svg>
      <div class="ringside">
        <div class="big">${line}</div>
        <div class="small">${st} day${st===1?"":"s"} holding the four that never pause</div>
      </div></div></div>
    <div class="card">`;
  for(const k of keys){
    const on=!!h[k];
    html+=`<button class="anchor ${on?"on":""}" data-h="${k}">
      <span class="box">✓</span>
      <span><span class="t">${HLABEL[k]}</span><br><span class="s">${subFor(k,vd)}</span></span></button>`;
  }
  if(done===n&&n)html+=`<div class="done-note">✓ Done. Close the app.</div>`;
  html+=`</div>`;
  if(!isT)html+=`<button class="btn secondary" id="d-today">Jump back to today</button>`;
  view.innerHTML=html;
  view.querySelectorAll(".anchor").forEach(b=>b.onclick=()=>{
    const dd=curViewDate();DB.habits[dd]=DB.habits[dd]||{};DB.habits[dd][b.dataset.h]=!DB.habits[dd][b.dataset.h];save();renderToday();});
  document.getElementById("d-prev").onclick=()=>{viewDate=addDays(vd,-1);renderToday();};

/* Revised 24 Aug 2026 after full data analysis. TDEE ~2400 (BMR 1751 + measured active 441
   + TEF). 1kg/wk would require eating ~1300 kcal — not survivable alongside 4 lifts/week.
   0.75kg/wk is the honest ceiling that preserves muscle (~1% bodyweight/week). */
const GOALS=[{date:"2026-09-30",kg:80,label:"Checkpoint"},{date:"2026-11-08",kg:76,label:"Target"}];
const STEP_TARGET=12000;
function goalStats(){
  if(!DB.weights.length)return null;
  const ws=[...DB.weights].sort((a,b)=>a.date<b.date?-1:1);
  const latest=ws[ws.length-1],first=ws[0];
  const t0=new Date(first.date+"T00:00:00").getTime();
  const tEnd=new Date(GOALS[GOALS.length-1].date+"T00:00:00").getTime();
  const tNow=new Date(latest.date+"T00:00:00").getTime();
  const frac=Math.min(1,Math.max(0,(tNow-t0)/((tEnd-t0)||1)));
  const expected=first.kg+(GOALS[GOALS.length-1].kg-first.kg)*frac;
  const wk=ws.filter(w=>(new Date(latest.date+"T00:00:00")-new Date(w.date+"T00:00:00"))/864e5<=7);
  const delta7=wk.length>1?+(latest.kg-wk[0].kg).toFixed(1):null;
  const total=ws.length>1?+(latest.kg-first.kg).toFixed(1):null;
  const days=(new Date(latest.date+"T00:00:00")-new Date(first.date+"T00:00:00"))/864e5;
  const peak=ws.reduce((a,w)=>w.kg>a.kg?w:a,ws[0]);
  const fromPeak=+(latest.kg-peak.kg).toFixed(1);
  return{kgToAug:+(latest.kg-80).toFixed(1),kgToSep:+(latest.kg-76).toFixed(1),onPace:latest.kg<=expected+0.3,latest,first,delta7,total,peak,fromPeak,days};
}
function goalStatRow(gs){

function drawWeightChart(id,weights){
  const[x,W,H]=ctx2(id);
  if(weights.length<2){x.fillStyle=css("--dim");x.font="12px -apple-system";x.fillText("Log two or more entries to see the trend.",10,80);return;}

  const span=Math.max(tGoalEnd,tLastW)-t0||1;

  });
  x.setLineDash([]);
  x.strokeStyle=css("--accent2");x.lineWidth=1;x.globalAlpha=.5;
  x.beginPath();x.moveTo(px(t0),py(ws[0].kg));x.lineTo(px(tGoalEnd),py(GOALS[GOALS.length-1].kg));x.stroke();x.globalAlpha=1;
  if(ws.length>=4){
    const avg=ws.map((w,i)=>{
      const tw=new Date(w.date+"T00:00:00").getTime();
      const win=ws.filter(o=>{const to=new Date(o.date+"T00:00:00").getTime();return to<=tw&&(tw-to)/864e5<7;});
      return{t:tw,kg:win.reduce((a,o)=>a+o.kg,0)/win.length};
    });
    x.strokeStyle=css("--accent");x.lineWidth=4;x.globalAlpha=.25;x.beginPath();
    avg.forEach((a,i)=>i?x.lineTo(px(a.t),py(a.kg)):x.moveTo(px(a.t),py(a.kg)));x.stroke();x.globalAlpha=1;
  }
  x.strokeStyle=css("--accent");x.lineWidth=2;x.beginPath();
  ws.forEach((w,i)=>{const t=new Date(w.date+"T00:00:00").getTime();i?x.lineTo(px(t),py(w.kg)):x.moveTo(px(t),py(w.kg));});x.stroke();
  x.fillStyle=css("--accent");
  ws.forEach(w=>{const t=new Date(w.date+"T00:00:00").getTime();x.beginPath();x.arc(px(t),py(w.kg),3,0,7);x.fill();});
  x.fillStyle=css("--dim");x.font="10px -apple-system";x.fillText(max.toFixed(0),2,py(max)+3);x.fillText(min.toFixed(0),2,py(min)+3);
}
function firstLoggedDay(){
  const logged=Object.keys(DB.habits).filter(d=>Object.values(DB.habits[d]||{}).some(Boolean)).sort();
  return logged.length?logged[0]:null;

function gridSpan(){
  const now=new Date(today()+"T00:00:00");
  const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const fl=firstLoggedDay();

  let n=Math.floor((mon-fMon)/(7*864e5))+1;

function habitGrid(){
  const{now,mon,firstDay,nWeeks}=gridSpan();
  const weeks=[];
  for(let w=nWeeks-1;w>=0;w--){const s=new Date(mon);s.setDate(mon.getDate()-7*w);weeks.push(s);}
  let html=`<div style="overflow-x:auto"><div style="display:grid;grid-template-columns:auto repeat(${nWeeks},minmax(16px,1fr)) auto;gap:3px;align-items:center;font-size:11px;min-width:min(100%,${60+nWeeks*20+30}px)">`;
  html+=`<span></span>`+weeks.map(s=>`<span style="color:var(--dim);text-align:center;font-size:9px">${iso(s).slice(5).replace("-","/")}</span>`).join("")+`<span style="color:var(--dim);font-size:9px">%</span>`;
  for(const[k,full,from]of HABITS){
    let hit=0,poss=0;
    const start=from&&from>iso(firstDay)?new Date(from+"T00:00:00"):firstDay;
    let row=`<span style="color:var(--text)">${SHORT[k]}</span>`;
    weeks.forEach(s=>{
      let n=0,days=0;
      for(let i=0;i<7;i++){
        const d=new Date(s);d.setDate(s.getDate()+i);
        if(d>now)break;
        if(d<start)continue;
        days++;if((DB.habits[iso(d)]||{})[k])n++;
      }
      hit+=n;poss+=days;
      const op=days===0?.35:(n===0?1:Math.max(.22,n/days));
      const bg=days===0?"var(--card2)":(n===0?"var(--card2)":"var(--accent)");
      row+=`<span title="${full}: ${days?n+"/"+days:"no data"}" style="height:16px;border-radius:4px;background:${bg};opacity:${op}"></span>`;
    });
    const pct=poss?Math.round(100*hit/poss):0;
    const col=pct>=70?"var(--accent)":pct>=40?"var(--warn)":"var(--dim)";
    row+=`<span style="color:${col};font-weight:700">${pct}</span>`;
    html+=row;
  }
  return html+`</div></div><p class="muted" style="margin-top:8px">Each square = one week (week starting date above). Brighter = more days hit. Right column = % of days since you started logging. Green ≥70 · amber ≥40.</p>`;

/* per-session strength progress. e1RM (Epley) normalises across the rep waves —
   comparing raw kg between a 9-11 rep wave and a 6-8 rep wave would mislead. */
function e1rm(s){return s.w*(1+s.r/30);}
function bestSet(entry){let b=entry.sets[0];entry.sets.forEach(s=>{if(e1rm(s)>e1rm(b))b=s;});return b;}
function sessionProgress(sess){
  const hs=DB.workouts.filter(w=>w.session===sess).sort((a,b)=>a.date<b.date?-1:1);
  const byEx={};
  hs.forEach(w=>w.entries.forEach(e=>{(byEx[e.ex]=byEx[e.ex]||[]).push({date:w.date,best:bestSet(e)});}));
  return{hs,byEx};
}

}
function barRow(k,sup){
  const r=anchorRateK(k,28),pc=r.of?Math.round(100*r.hit/r.of):0;
  const f=pc>=80?"":pc>=60?"ok":"mid";
  return `<button class="bar-row ${sup?"sup":""}" data-anchor="${k}"><span class="nm">${HLABEL[k]}</span>
    <span class="bar-track"><span class="bar-fill ${f}" style="width:${pc}%"></span></span>
    <span class="pc">${r.of?pc+"%":"—"}</span></button>`;
}
function rateA(days){let hit=0,of=0,d=today();
  for(let i=0;i<days;i++,d=addDays(d,-1)){if(d<DB.startDate)continue;const r=dayScoreA(d);hit+=r.done;of+=r.of;}
  return of?Math.round(100*hit/of):0;}
function habitStart(k){const h=HABITS.find(x=>x[0]===k);return h&&h[2]?h[2]:DB.startDate;}
function appliesOn(k,ds){
  if(ds<habitStart(k))return false;
  if(ANCHOR_KEYS.includes(k))return askedOn(ds).includes(k);
  return true;}
function anchorRateK(k,days){let hit=0,of=0,d=today();
  for(let i=0;i<days;i++,d=addDays(d,-1)){if(!appliesOn(k,d))continue;of++;if((DB.habits[d]||{})[k])hit++;}
  return{hit,of};}
function runOf(k){let n=0,d=today();
  for(;;){if(d<DB.startDate)break;
    if(!appliesOn(k,d)){d=addDays(d,-1);continue;}
    if(!(DB.habits[d]||{})[k]){if(d===today()){d=addDays(d,-1);continue;}break;}
    n++;d=addDays(d,-1);if(n>3650)break;}
  return n;}
function heatCells(weeks){
  const first=addDays(mondayISO(today()),-7*(weeks-1));let out="";
  for(let w=0;w<weeks;w++)for(let i=0;i<7;i++){
    const s=addDays(first,w*7+i);
    if(s>today()||s<DB.startDate){out+=`<i class="future"></i>`;continue;}
    const r=dayScoreA(s),p=r.of?r.done/r.of:0;
    const l=p===0?"":p<.4?"l1":p<.7?"l2":p<1?"l3":"l4";
    out+=`<i class="${l}" title="${s} · ${r.done}/${r.of}"></i>`;}
  return out;}

/* ---- panel 2: the body ---- */
function bodyPanel(){
  const gs=goalStats();
  const daysTo=ds=>Math.ceil((new Date(ds+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
  let h=`<div class="card" id="wcard" style="cursor:pointer">`;
  if(gs){
    const next=GOALS.find(g=>gs.latest.kg>g.kg)||GOALS[GOALS.length-1];
    const toGo=+(gs.latest.kg-next.kg).toFixed(1);
    const rate=gs.total!==null&&gs.days>7?(gs.total/gs.days*7):null;
    const rcls=rate===null?"flat":rate<=-0.6?"good":rate<0?"flat":"bad";
    h+=`<div class="hero"><div class="n">${gs.latest.kg}</div><div class="u">kg</div>
        <div class="delta ${rcls}">${rate===null?"—":rate.toFixed(2)+" kg/wk"}</div></div>
      <div class="muted" style="margin-top:6px">
        ${toGo>0?`<b>${toGo} kg</b> to ${next.kg} by ${next.date.slice(8)}/${next.date.slice(5,7)} · ${daysTo(next.date)} days`
                :`${next.kg} kg reached ✓`}
        &nbsp;·&nbsp; <span style="color:${gs.onPace?"var(--accent)":"var(--warn)"}">${gs.onPace?"on pace":"behind pace"}</span></div>
      <canvas id="wchart" width="600" height="160" style="margin-top:8px"></canvas>
      <div class="muted">Green = weigh-ins · faint green = 7-day average · amber = goal checkpoints · blue = pace. Tap to log.</div>`;
  }else{
    h+=`<div class="hero"><div class="n">—</div><div class="u">kg</div></div>
        <div class="muted" style="margin-top:6px">Tap to log your first weigh-in. Friday mornings.</div>`;
  }
  h+=`</div>`;

  const wk=sessionsThisWeek(),vol=volumeTrend();
  const wa=[...DB.waist].sort((a,b)=>a.date<b.date?-1:1),lw=wa.length?wa[wa.length-1]:null;
  const st14=[...DB.steps].sort((a,b)=>a.date<b.date?-1:1).slice(-14);
  const stAvg=st14.length?Math.round(st14.reduce((a,x)=>a+x.n,0)/st14.length):null;
  h+=`<div class="tiles">
    <button class="tile" id="t-sess"><div class="v">${wk}<span style="font-size:13px;color:var(--dim)">/5</span></div><div class="l">sessions<br>this week</div><div class="chev">▾</div></button>
    <button class="tile" id="t-lift"><div class="v">${vol===null?"—":vol===0?"flat":(vol>0?"▲":"▼")+Math.abs(vol)+"%"}</div><div class="l">strength<br>trend</div><div class="chev">▾</div></button>
    <button class="tile" id="t-prog"><div class="v">W${weekNum()}</div><div class="l">${isDeload()?"DELOAD week":"wave "+(phaseIdx()+1)}</div><div class="chev">▾</div></button>
    <button class="tile" id="t-waist"><div class="v">${lw?lw.cm:"—"}</div><div class="l">waist<br>cm</div><div class="chev">▾</div></button>
    <button class="tile" id="t-steps"><div class="v">${stAvg?(stAvg/1000).toFixed(1)+"k":"—"}</div><div class="l">steps avg<br>last ${st14.length||0}d</div><div class="chev">▾</div></button>
    <button class="tile" id="t-act"><div class="v">${DB.workouts.length+DB.cardio.length}</div><div class="l">sessions<br>logged</div><div class="chev">▾</div></button>
  </div>`;
  return h;
}
function sessionsThisWeek(){const mon=mondayISO(today());let n=0;
  for(let i=0;i<7;i++){const s=addDays(mon,i);if(s>today())break;if((DB.habits[s]||{}).t)n++;}return n;}
function volOf(w){return w.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);}
function volumeTrend(){const w=DB.workouts.slice(-6);if(w.length<4)return null;
  const half=Math.floor(w.length/2),a=w.slice(0,half),b=w.slice(half);
  const av=a.reduce((s,x)=>s+volOf(x),0)/a.length,bv=b.reduce((s,x)=>s+volOf(x),0)/b.length;
  return av?Math.round(100*(bv-av)/av):null;}

/* ---- drill-downs ---- */
const scrim=document.getElementById("scrim"),sheetEl=document.getElementById("sheet"),sheetBody=document.getElementById("sheet-body");
function openSheet(html){sheetBody.innerHTML=html;scrim.classList.add("show");sheetEl.classList.add("show");}
function closeSheet(){scrim.classList.remove("show");sheetEl.classList.remove("show");}
scrim.onclick=closeSheet;

function bindProgress(){
  view.querySelectorAll("[data-anchor]").forEach(b=>b.onclick=()=>sheetAnchor(b.dataset.anchor));
  const wc=document.getElementById("wcard");if(wc)wc.onclick=sheetWeight;
  document.getElementById("t-sess").onclick=sheetSessions;
  document.getElementById("t-lift").onclick=sheetLifts;
  document.getElementById("t-prog").onclick=sheetProgram;
  document.getElementById("t-waist").onclick=sheetWaist;
  document.getElementById("t-steps").onclick=sheetSteps;
  document.getElementById("t-act").onclick=sheetActivity;
}
function sheetAnchor(k){
  const r28=anchorRateK(k,28),r84=anchorRateK(k,84);
  let strip="",d=addDays(today(),-83);
  for(let i=0;i<84;i++,d=addDays(d,1))
    strip += !appliesOn(k,d) ? `<i class="na"></i>` : `<i class="${(DB.habits[d]||{})[k]?"on":""}"></i>`;
  const isA=ANCHOR_KEYS.includes(k);
  openSheet(`<h3>${HLABEL[k]}</h3>
    <div class="sh-sub">${isA?(CORE_A.includes(k)?"never pauses":"only on the days that ask it"):"supporting metric, not an anchor"}</div>
    <div class="strip">${strip}</div>
    <div class="kv"><span>Last 28 days</span><span>${r28.of?r28.hit+" of "+r28.of+" · "+Math.round(100*r28.hit/r28.of)+"%":"no data"}</span></div>
    <div class="kv"><span>Last 12 weeks</span><span>${r84.of?r84.hit+" of "+r84.of+" · "+Math.round(100*r84.hit/r84.of)+"%":"no data"}</span></div>
    <div class="kv"><span>Current run</span><span>${runOf(k)} in a row</span></div>
    <div class="kv"><span>Rule</span><span>never miss twice</span></div>`);
}
function sheetWeight(){
  const W=[...DB.weights].sort((a,b)=>a.date<b.date?-1:1).slice(-14).reverse();
  openSheet(`<h3>Bodyweight</h3><div class="sh-sub">Friday mornings, or backdate any day. Judge the trend, never the day.</div>
    <div class="row" style="margin-bottom:14px">
      <input type="date" id="wt-date" value="${today()}" max="${today()}" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)">
      <input type="number" step="0.1" class="big" id="wt" placeholder="kg">
      <button class="btn small" id="wt-save" style="margin:0">Log</button></div>
    ${GOALS.map(g=>`<div class="kv"><span>${g.label} · ${g.date}</span><span>${g.kg} kg</span></div>`).join("")}
    <div class="subhead">Recent</div>
    ${W.map(w=>`<div class="kv"><span>${w.date}</span><span>${w.kg} kg</span></div>`).join("")||`<p class="muted">No weigh-ins yet.</p>`}`);
  document.getElementById("wt-save").onclick=()=>{
    const v=+document.getElementById("wt").value;if(!v)return;
    const dt=document.getElementById("wt-date").value||today();
    const ex=DB.weights.find(w=>w.date===dt);if(ex)ex.kg=v;else DB.weights.push({date:dt,kg:v});
    save();closeSheet();toast("Weight logged");render();};
}
function sheetWaist(){
  openSheet(`<h3>Waist</h3><div class="sh-sub">Weekly at the navel, same time of day, relaxed. Truer than mass while you recomposition.</div>${waistCard()}`);
  document.getElementById("wa-save").onclick=()=>{
    const v=+document.getElementById("wa").value;if(!v)return;
    const dt=document.getElementById("wa-date").value||today();
    const ex=DB.waist.find(x=>x.date===dt);if(ex)ex.cm=v;else DB.waist.push({date:dt,cm:v});
    save();closeSheet();toast("Waist logged");render();};
  const ws=[...DB.waist].sort((a,b)=>a.date<b.date?-1:1);
  if(ws.length>1&&document.getElementById("wachart"))drawLine("wachart",ws.map(x=>x.cm),ws.map(x=>x.date.slice(5)));
}
function sheetSteps(){
  openSheet(`<h3>Steps</h3><div class="sh-sub">Read from Health once a day. Hitting ${STEP_TARGET.toLocaleString()} auto-ticks the anchor.</div>${stepsCard()}`);
  document.getElementById("st-save").onclick=()=>{
    const v=+document.getElementById("st").value;if(!v)return;
    const dt=document.getElementById("st-date").value||today();
    const ex=DB.steps.find(x=>x.date===dt);if(ex)ex.n=v;else DB.steps.push({date:dt,n:v});
    if(v>=STEP_TARGET){DB.habits[dt]=DB.habits[dt]||{};DB.habits[dt].n=true;}
    save();closeSheet();toast("Steps logged");render();};
  const ss=[...DB.steps].sort((a,b)=>a.date<b.date?-1:1).slice(-14);
  if(ss.length&&document.getElementById("stchart"))
    drawBars("stchart",ss.map(x=>x.n),ss.map(x=>x.date.slice(5)),Math.max(STEP_TARGET,...ss.map(x=>x.n)),STEP_TARGET);
}
function sheetLifts(){
  openSheet(`<h3>Strength</h3><div class="sh-sub">Best set per session, compared by estimated 1RM so the rep waves don't distort it.</div>${sessionCard()}`);
  sheetBody.querySelectorAll("[data-sess]").forEach(b=>b.onclick=()=>{progSess=b.dataset.sess;sheetLifts();});
  const sp=sessionProgress(progSess);
  if(sp.hs.length&&document.getElementById("schart")){
    const sv=sp.hs.map(w=>Math.round(volOf(w)));
    drawBars("schart",sv,sp.hs.map(w=>w.date.slice(5)),Math.max(...sv,1));}
}
function sheetSessions(){
  const mon=mondayISO(today());
  let rows="";
  for(let i=0;i<7;i++){const s=addDays(mon,i);
    const nm=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i];
    const did=(DB.habits[s]||{}).t;
    const plan=TRAIN_BY_DAY[dowOf(s)]||"rest";
    rows+=`<div class="kv"><span>${nm} · ${plan}</span><span>${s>today()?"—":did?"✓ done":"missed"}</span></div>`;}
  openSheet(`<h3>This week's training</h3><div class="sh-sub">Target 5 sessions. Success is arriving in kit.</div>${rows}`);
}
function sheetProgram(){
  openSheet(`<h3>Week ${weekNum()} of the block</h3>
    <div class="sh-sub">${isDeload()?"Deload week — halve everything.":SCHEMES[phaseIdx()]}</div>
    <div class="kv"><span>Started</span><span>${DB.startDate}</span></div>
    <div class="kv"><span>Wave</span><span>${phaseIdx()+1} of 3</span></div>
    <div class="kv"><span>Next deload</span><span>week ${nextDeload()}</span></div>
    <div class="kv"><span>Logged</span><span>${DB.workouts.length} workouts · ${DB.cardio.length} cardio · ${DB.weights.length} weigh-ins</span></div>`);
}
function nextDeload(){let w=weekNum();while(!(w===8||w===12||(w>12&&(w-12)%4===0)))w++;return w;}
function sheetActivity(){
  const all=[...DB.workouts.map(w=>({...w,type:"s"})),...DB.cardio.map(c=>({...c,type:"c"}))]
    .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,20);
  const rows=all.map(w=>w.type==="s"
    ?`<div class="kv"><span>${w.date} · session ${w.session}</span><span>${Math.round(volOf(w)).toLocaleString()} kg · ${w.entries.length} lifts</span></div>`
    :`<div class="kv"><span>${w.date} · cardio</span><span>${w.min} min${w.km?" · "+w.km+" km":""}</span></div>`).join("");
  openSheet(`<h3>Recent activity</h3><div class="sh-sub">Last ${all.length} sessions, strength and cardio</div>
    ${rows||`<p class="muted">Nothing logged yet — the app is waiting, not judging.</p>`}`);
}

function weeklyHabitTotals(nWeeks){
  const out=[];const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  for(let w=nWeeks-1;w>=0;w--){const start=new Date(mon);start.setDate(mon.getDate()-7*w);let n=0,poss=0;
    for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d);
      if(d>now)continue;
      const h=DB.habits[ds]||{},act=habitsOn(ds);
      n+=act.filter(x=>h[x[0]]).length;poss+=act.length;}
    out.push({label:iso(start).slice(5),n,pct:poss?Math.round(100*n/poss):0});}
  return out;
}
function ctx2(id){const c=document.getElementById(id);const dpr=window.devicePixelRatio||1;const w=c.clientWidth;c.width=w*dpr;c.height=160*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);return[x,w,160];}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function drawLine(id,vals,labels){
  const[x,W,H]=ctx2(id);if(vals.length<2){x.fillStyle=css("--dim");x.font="12px -apple-system";x.fillText("Log two or more entries to see the trend.",10,80);return;}
  const min=Math.min(...vals)-0.5,max=Math.max(...vals)+0.5,px=i=>30+(W-40)*i/(vals.length-1),py=v=>H-20-(H-40)*(v-min)/(max-min);
  x.strokeStyle=css("--line");x.beginPath();x.moveTo(30,H-20);x.lineTo(W-10,H-20);x.stroke();
  x.strokeStyle=css("--accent");x.lineWidth=2;x.beginPath();vals.forEach((v,i)=>i?x.lineTo(px(i),py(v)):x.moveTo(px(0),py(v)));x.stroke();
  x.fillStyle=css("--accent");vals.forEach((v,i)=>{x.beginPath();x.arc(px(i),py(v),3,0,7);x.fill();});
  x.fillStyle=css("--dim");x.font="10px -apple-system";x.fillText(String(max-0.5),2,py(max-0.5)+3);x.fillText(String(min+0.5),2,py(min+0.5)+3);
}
function drawBars(id,vals,labels,maxV,targetLine){
  const[x,W,H]=ctx2(id);const bw=(W-40)/vals.length;
  vals.forEach((v,i)=>{const h=(H-40)*v/maxV;
    x.fillStyle=(targetLine&&v>=targetLine)?css("--accent"):css("--accent2");
    x.fillRect(30+i*bw+4,H-20-h,bw-8,h);
    x.fillStyle=css("--dim");x.font="9px -apple-system";x.fillText(labels[i],30+i*bw+4,H-6);
    if(v)x.fillText(v>=1000?Math.round(v/1000)+"k":v,30+i*bw+bw/2-8,H-24-h);});
  if(targetLine){const ty=H-20-(H-40)*targetLine/maxV;
    x.strokeStyle=css("--warn");x.setLineDash([4,3]);x.lineWidth=1;
    x.beginPath();x.moveTo(30,ty);x.lineTo(W-10,ty);x.stroke();x.setLineDash([]);}
}

/* ----- Data ----- */
function renderData(){
  view.innerHTML=`<div class="card"><h2>Backup & sync</h2>
    <p class="muted" style="margin-bottom:10px">Data lives on this device. Export weekly (Sunday Review) and store the file in iCloud Drive — that's your sync and your backup.</p>
    <button class="btn secondary" id="exp">Export JSON</button>
    <p class="muted" style="margin:12px 0 6px">Import (paste JSON):</p><textarea id="imp"></textarea>
    <button class="btn secondary" id="impb" style="margin-top:8px">Import</button></div>
    <div class="card"><h2>Program start date</h2>
    <div class="row"><input type="date" id="sd" value="${DB.startDate}" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><button class="btn small" id="sdb" style="margin:0">Set</button></div>
    <p class="muted" style="margin-top:8px">Drives week number, phase and deload flags. Stats: ${DB.workouts.length} workouts · ${Object.keys(DB.habits).length} habit days · ${DB.weights.length} weigh-ins.</p></div>`;
  document.getElementById("exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`lifeos-backup-${today()}.json`;a.click();toast("Exported");};
  document.getElementById("impb").onclick=()=>{try{const d=JSON.parse(document.getElementById("imp").value);if(!d.habits)throw 0;DB=d;save();toast("Imported");render();}catch(e){toast("Invalid JSON");}};
  document.getElementById("sdb").onclick=()=>{DB.startDate=document.getElementById("sd").value;save();toast("Start date set");render();};
}

/* ---------- nav ---------- */
function setNav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pickedSession=null;viewDate=null;closeSheet();setNav();render();});
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
